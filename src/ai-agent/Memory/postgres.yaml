apiVersion: v1
kind: Service
metadata:
  name: advisor-memory-postgres
  namespace: trading-adaptive-apps
  labels:
    app.kubernetes.io/name: advisor-memory-postgres
    app.kubernetes.io/managed-by: containerization-assist
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: advisor-memory-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: advisor-memory-postgres
  namespace: trading-adaptive-apps
  labels:
    app.kubernetes.io/name: advisor-memory-postgres
    app.kubernetes.io/managed-by: containerization-assist
spec:
  serviceName: advisor-memory-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: advisor-memory-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advisor-memory-postgres
        app.kubernetes.io/managed-by: containerization-assist
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: advisor_memory
            - name: POSTGRES_USER
              value: memory_owner
            - name: POSTGRES_PASSWORD_FILE
              value: /run/credentials/owner-password
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --auth-local=scram-sha-256
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "memory_owner", "-d", "advisor_memory"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "memory_owner", "-d", "advisor_memory"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "memory_owner", "-d", "advisor_memory"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: credentials
              mountPath: /run/credentials
              readOnly: true
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: advisor-memory-database
            defaultMode: 0440
        - name: socket
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: advisor-memory-retained
        resources:
          requests:
            storage: 1Gi
