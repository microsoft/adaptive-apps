{{- /*
  Open Policy Agent (OPA) deployed as a centralized external authorization
  service for the Istio service mesh, using the opa-envoy-plugin image
  (openpolicyagent/opa:<version>-envoy) which embeds the Envoy External
  Authorization gRPC plugin.

  Istio is patched separately (see post-install-istio-extauthz.yaml) to add
  this service as a mesh extensionProvider so AuthorizationPolicy resources
  with `action: CUSTOM` can delegate decisions to OPA.
*/}}
{{- if .Values.opa.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.opa.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ent.labels" . | nindent 4 }}
    app: {{ .Values.opa.name }}
---
# OPA runtime configuration. The plugins block enables the embedded
# envoy.ext_authz gRPC server on the configured port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.opa.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ent.labels" . | nindent 4 }}
    app: {{ .Values.opa.name }}
data:
  config.yaml: |
    decision_logs:
      console: true
    plugins:
      envoy_ext_authz_grpc:
        addr: :{{ .Values.opa.grpcPort }}
        path: {{ .Values.opa.defaultDecisionPath }}
---
# Default Rego policy. Operators are expected to override this with their
# own policies (e.g. via a separate ConfigMap or a bundle server). The
# default policy allows all requests so the mesh remains functional out of
# the box; tighten this in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.opa.name }}-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ent.labels" . | nindent 4 }}
    app: {{ .Values.opa.name }}
data:
  policy.rego: |
    package envoy.authz

    import rego.v1

    # Default-allow policy. Replace with workload-specific rules.
    default allow := true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.opa.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ent.labels" . | nindent 4 }}
    app: {{ .Values.opa.name }}
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.opa.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.opa.name }}
      annotations:
        # OPA is the policy decision point for the mesh; it must not be
        # subject to its own enforcement. Skip Istio sidecar injection.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ .Values.opa.name }}
      containers:
      - name: opa
        image: "{{ .Values.opa.image.repository }}:{{ .Values.opa.image.tag }}"
        imagePullPolicy: {{ .Values.opa.image.pullPolicy }}
        args:
        - "run"
        - "--server"
        - "--addr=0.0.0.0:{{ .Values.opa.httpPort }}"
        - "--diagnostic-addr=0.0.0.0:{{ .Values.opa.diagnosticPort }}"
        - "--config-file=/config/config.yaml"
        - "--log-level={{ .Values.opa.logLevel }}"
        - "/policies"
        ports:
        - containerPort: {{ .Values.opa.grpcPort }}
          name: grpc
          protocol: TCP
        - containerPort: {{ .Values.opa.httpPort }}
          name: http
          protocol: TCP
        - containerPort: {{ .Values.opa.diagnosticPort }}
          name: diagnostic
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health?plugins
            port: diagnostic
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: diagnostic
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: policies
          mountPath: /policies
          readOnly: true
        resources:
          {{- toYaml .Values.opa.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ .Values.opa.name }}-config
      - name: policies
        configMap:
          name: {{ .Values.opa.name }}-policy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.opa.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ent.labels" . | nindent 4 }}
    app: {{ .Values.opa.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.opa.name }}
  ports:
  - name: grpc
    port: {{ .Values.opa.grpcPort }}
    targetPort: grpc
    protocol: TCP
    appProtocol: grpc
  - name: http
    port: {{ .Values.opa.httpPort }}
    targetPort: http
    protocol: TCP
{{- end }}
