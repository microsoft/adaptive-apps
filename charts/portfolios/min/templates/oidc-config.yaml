{{- /*
  Single source of truth for OIDC endpoint values consumed by downstream
  workloads (e.g. the `frontend` container, or the `rad deploy app.bicep`
  step in the tutorials).

  Two modes:
    • components.keycloak.enabled=true  → endpoints derived from the
      in-cluster Keycloak Service. `realm` defaults to `master`.
    • components.keycloak.enabled=false → endpoints come from
      `oidc.external.*` in values.

  The ConfigMap also surfaces the operator-managed client Secret reference
  (name+key) so callers can resolve it without knowing the chart layout:

      eval $(kubectl get cm <release>-oidc -n <ns> \
        -o jsonpath='{range .data}{.issuer}{"\n"}{.authEndpoint}{"\n"}...')

      kubectl get secret "$clientSecretName" -n <ns> \
        -o jsonpath="{.data.${clientSecretKey}}" | base64 -d
*/}}
{{- $kc := .Values.components.keycloak.enabled -}}
{{- $issuer := "" -}}
{{- $auth := "" -}}
{{- $token := "" -}}
{{- $userinfo := "" -}}
{{- if $kc -}}
  {{- $svc := include "min.keycloak.serviceName" . -}}
  {{- $port := int .Values.keycloak.service.port -}}
  {{- $base := printf "http://%s.%s.svc.cluster.local:%d/realms/%s" $svc .Release.Namespace $port .Values.oidc.realm -}}
  {{- $issuer = $base -}}
  {{- $auth = printf "%s/protocol/openid-connect/auth" $base -}}
  {{- $token = printf "%s/protocol/openid-connect/token" $base -}}
  {{- $userinfo = printf "%s/protocol/openid-connect/userinfo" $base -}}
{{- else -}}
  {{- $issuer = .Values.oidc.external.issuer -}}
  {{- $auth = .Values.oidc.external.authEndpoint -}}
  {{- $token = .Values.oidc.external.tokenEndpoint -}}
  {{- $userinfo = .Values.oidc.external.userInfoEndpoint -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "min.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "min.labels" . | nindent 4 }}
data:
  mode: {{ ternary "keycloak" "external" $kc | quote }}
  issuer: {{ $issuer | quote }}
  authEndpoint: {{ $auth | quote }}
  browserAuthEndpoint: {{ .Values.oidc.browserAuthEndpoint | quote }}
  tokenEndpoint: {{ $token | quote }}
  userInfoEndpoint: {{ $userinfo | quote }}
  clientId: {{ .Values.oidc.clientId | quote }}
  clientSecretName: {{ .Values.oidc.clientSecretRef.name | quote }}
  clientSecretKey: {{ .Values.oidc.clientSecretRef.key | quote }}
