{{- if and .Values.components.keycloak.enabled .Values.keycloak.customCert.crt }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "computeCore.keycloak.serviceName" . }}-custom-cert
  labels:
    {{- include "computeCore.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  {{ .Values.keycloak.customCert.fileName | quote }}: |
{{ .Values.keycloak.customCert.crt | nindent 4 }}
{{- end }}
