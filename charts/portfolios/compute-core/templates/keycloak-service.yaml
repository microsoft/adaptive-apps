{{- if .Values.components.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "computeCore.keycloak.serviceName" . }}
  labels:
    {{- include "computeCore.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "computeCore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
