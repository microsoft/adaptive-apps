{{- if and .Values.components.keycloak.enabled .Values.keycloak.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "computeCore.keycloak.serviceName" . }}
  labels:
    {{- include "computeCore.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- with .Values.keycloak.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.keycloak.ingress.className }}
  ingressClassName: {{ .Values.keycloak.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.keycloak.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "computeCore.keycloak.serviceName" $ }}
                port:
                  number: {{ $.Values.keycloak.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.keycloak.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
