{{- if .Values.components.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "min.keycloak.discoveryServiceName" . }}
  labels:
    {{- include "min.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "min.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
