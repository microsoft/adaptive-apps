{{- if .Values.components.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "min.keycloak.serviceName" . }}-admin
  labels:
    {{- include "min.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  username: {{ .Values.keycloak.admin.username | quote }}
  password: {{ .Values.keycloak.admin.password | quote }}
{{- end }}
