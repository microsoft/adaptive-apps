{{- /*
  Post-install Job that applies a mesh-wide STRICT PeerAuthentication in the
  Istio root namespace once the Istio CRDs are present (installed by the
  pre-install hook or by the AKS mesh add-on). This enforces mTLS across
  every namespace that has sidecar injection enabled, without requiring the
  chart to know every app namespace in advance.

  Sidecar injection is still applied per-namespace via the
  `istio-injection=enabled` label, which Radius (or the operator) sets when
  the app namespace is created.
*/}}
{{- if .Values.istio.mtls.strict }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "core.name" . }}-peer-auth
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["security.istio.io"]
  resources: ["peerauthentications"]
  verbs: ["create", "update", "patch", "get", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "core.name" . }}-peer-auth
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "core.name" . }}-peer-auth
subjects:
- kind: ServiceAccount
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Bound the total wall-clock time: if the Istio CRD never appears (e.g. the
  # AKS mesh add-on was not enabled), fail fast with a clear error rather than
  # spinning forever.
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: {{ include "core.name" . }}-peer-auth
      restartPolicy: Never
      containers:
      - name: apply-peer-auth
        image: {{ .Values.istio.peerAuthJob.image | default "alpine/k8s:1.31.13" }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for PeerAuthentication CRD (security.istio.io)..."
          for i in $(seq 1 60); do
            if kubectl get crd peerauthentications.security.istio.io >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          if ! kubectl get crd peerauthentications.security.istio.io >/dev/null 2>&1; then
            echo "ERROR: PeerAuthentication CRD not found after 3 minutes."
            echo "  - On local clusters, set istio.install.enabled=true (default)."
            echo "  - On AKS, enable the mesh add-on: az aks mesh enable ..."
            exit 1
          fi

          # Mesh-wide STRICT mTLS: a PeerAuthentication in the Istio root
          # namespace applies to every workload in the mesh.
          kubectl apply -f - <<'YAML'
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: {{ .Values.istio.namespace }}
          spec:
            mtls:
              mode: STRICT
          YAML

          echo "Mesh-wide PeerAuthentication applied in {{ .Values.istio.namespace }}."
{{- end }}
