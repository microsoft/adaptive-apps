{{- /*
  Post-install Job that applies PeerAuthentication resources once Istio CRDs
  are guaranteed to be present (installed by the pre-install hook).

  Runs for both local k8s (istio.install.enabled=true) and AKS
  (istio.install.enabled=false, CRDs come from AKS mesh add-on).
*/}}
{{- if .Values.istio.mtls.strict }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "core.name" . }}-peer-auth
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["security.istio.io"]
  resources: ["peerauthentications"]
  verbs: ["create", "update", "patch", "get", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "core.name" . }}-peer-auth
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "core.name" . }}-peer-auth
subjects:
- kind: ServiceAccount
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "core.name" . }}-peer-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "core.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: {{ include "core.name" . }}-peer-auth
      restartPolicy: Never
      containers:
      - name: apply-peer-auth
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for PeerAuthentication CRD..."
          until kubectl get crd peerauthentications.security.istio.io >/dev/null 2>&1; do
            sleep 3
          done

          {{- range .Values.istio.mtls.namespaces }}
          kubectl apply -f - <<'YAML'
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: {{ . }}
          spec:
            mtls:
              mode: STRICT
          YAML
          {{- end }}

          echo "PeerAuthentication applied."
{{- end }}
