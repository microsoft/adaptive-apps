{{- /*
  Labels each namespace listed under istio.mtls.namespaces for Istio sidecar
  injection (istio-injection=enabled).

  Applied regardless of install.enabled so that AKS mesh add-on environments
  also have their app namespaces enrolled automatically.
*/}}
{{- if .Values.istio.mtls.strict }}
{{- range .Values.istio.mtls.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    istio-injection: enabled
{{- end }}
{{- end }}
