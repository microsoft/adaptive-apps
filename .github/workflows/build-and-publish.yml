name: Build and Publish Application Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VERSION: 'latest'
  CONTAINER_REGISTRY: 'ghcr.io/${{ github.repository_owner }}'

jobs:
  build-ghcr:
    name: Build and push application images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: src/backend/
            image: adaptive-apps/backend
          - directory: src/ai-agent/
            image: adaptive-apps/ai-agent
          - directory: src/frontend/
            image: adaptive-apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.directory }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}

      # - name: Scan for vulnerabilities in ${{ matrix.image }}
      #   uses: crazy-max/ghaction-container-scan@v3
      #   with:
      #     image: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}
