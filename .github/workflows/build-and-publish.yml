name: Build and Publish Application Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VERSION: 'latest'
  CONTAINER_REGISTRY: 'ghcr.io/${{ github.repository_owner }}'

jobs:
  build-ghcr:
    name: Build and push application images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: src/backend/
            image: adaptive-apps/backend
          - directory: src/ai-agent/
            image: adaptive-apps/ai-agent
          - directory: src/frontend/
            image: adaptive-apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.directory }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}

      # - name: Scan for vulnerabilities in ${{ matrix.image }}
      #   uses: crazy-max/ghaction-container-scan@v3
      #   with:
      #     image: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}
