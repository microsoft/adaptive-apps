name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-helm-charts.yml'
      - 'charts/adaptive-apps/**'

env:
  OCI_REGISTRY: ghcr.io
  CHART_PATH: charts/adaptive-apps
  CHART_NAME: adaptive-apps

jobs:
  release:
    name: Release adaptive-apps chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | helm registry login ${{ env.OCI_REGISTRY }} \
            -u "${{ github.actor }}" --password-stdin

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_PATH }}

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }}

      - name: Package chart
        id: package
        run: |
          set -euo pipefail

          mkdir -p .helm-packages
          helm package ${{ env.CHART_PATH }} --destination .helm-packages

          chart_version="$(helm show chart ${{ env.CHART_PATH }} \
            | awk -F': ' '/^version:/ {print $2}')"
          package_file=".helm-packages/${{ env.CHART_NAME }}-${chart_version}.tgz"

          if [[ ! -f "$package_file" ]]; then
            echo "Unable to find packaged chart at $package_file"
            exit 1
          fi

          echo "version=$chart_version"               >> "$GITHUB_OUTPUT"
          echo "package_file=$package_file"           >> "$GITHUB_OUTPUT"
          echo "release_tag=helm-${{ env.CHART_NAME }}-v${chart_version}" >> "$GITHUB_OUTPUT"
          echo "oci_repo=oci://${{ env.OCI_REGISTRY }}/${{ github.repository_owner }}/adaptive-apps/charts" \
            >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR OCI registry
        run: |
          helm push "${{ steps.package.outputs.package_file }}" \
            "${{ steps.package.outputs.oci_repo }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ${{ steps.package.outputs.package_file }}
          tag: ${{ steps.package.outputs.release_tag }}
          name: Helm ${{ env.CHART_NAME }} v${{ steps.package.outputs.version }}
          body: |
            Released unified Helm chart `${{ env.CHART_NAME }}`.

            Install:

            ```bash
            helm install <release> \
              ${{ steps.package.outputs.oci_repo }}/${{ env.CHART_NAME }} \
              --version ${{ steps.package.outputs.version }} \
              -f profiles/<portfolio>.yaml
            ```

            Or with `ada`:

            ```bash
            ada bootstrap --portfolio <portfolio> --platform <platform>
            ```
