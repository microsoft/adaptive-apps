apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.16.2
        name: nvidia-device-plugin-ctr
        env:
        - name: FAIL_ON_INIT_ERROR
          value: "true"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "all"
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-nvidia-runtimeclass-to-kaito-workloads
spec:
  background: false
  rules:
  - name: add-runtimeclass-to-gpu-statefulsets
    match:
      any:
      - resources:
          kinds:
          - StatefulSet
    preconditions:
      all:
      - key: "{{ request.object.spec.template.spec.containers[].resources.limits.\"nvidia.com/gpu\" || `[]` }}"
        operator: AnyIn
        value:
        - "1"
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              runtimeClassName: nvidia